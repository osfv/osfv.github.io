<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>iqad — 404</title>
  <meta name="description" content="This page isn't here." />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#141414" />
  <link rel="icon" type="image/png" href="/assets/iqad.png" />
  <link rel="preload" href="/assets/fonts/DepartureMono-Regular.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/site.css?v=12" />
  <style>html:not(.is-ready) main{visibility:hidden}</style>
  <noscript><style>html:not(.is-ready) main{visibility:visible}.mark,h1,h1 .word,p,.stamp,.albums,.albums li{opacity:1!important;animation:none!important}</style></noscript>
</head>
<body>
  <main>
    <canvas class="mark" width="72" height="72" role="img" aria-label="iqad, looking around"></canvas>
    <h1 style="--delay: 80ms">404</h1>
    <p class="stamp" style="--delay: 200ms">nothing here</p>
    <p style="--delay: 360ms">
      <a href="/">← home</a>
    </p>
  </main>

  <script src="/site.js?v=1"></script>
  <script>
    (() => {
      const go = () => document.documentElement.classList.add('is-ready');
      const fail = setTimeout(go, 1600);
      const ready = (document.fonts && document.fonts.ready)
        ? document.fonts.ready
        : Promise.resolve();
      ready.then(() => { clearTimeout(fail); go(); }).catch(go);
    })();
    (() => {
      const canvas = document.querySelector('canvas.mark');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      const GRID = 12;
      const SIZE = 72;
      const PIX = 5;
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

      const dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
      canvas.width = SIZE * dpr;
      canvas.height = SIZE * dpr;
      canvas.style.width = SIZE + 'px';
      canvas.style.height = SIZE + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.imageSmoothingEnabled = false;

      const cell = SIZE / GRID;
      const pad = Math.floor((cell - PIX) / 2);

      const L = {
        c: [[3,3],[4,3],[3,4],[4,4]],
        l: [[2,3],[3,3],[2,4],[3,4]],
        r: [[4,3],[5,3],[4,4],[5,4]],
        shut: [[3,4],[4,4]],
      };
      const R = {
        c: [[7,3],[8,3],[7,4],[8,4]],
        l: [[6,3],[7,3],[6,4],[7,4]],
        r: [[8,3],[9,3],[8,4],[9,4]],
        shut: [[7,4],[8,4]],
      };
      const M_SMALL = [[5,8],[6,8]];
      const M_O     = [[5,7],[6,7],[5,8],[6,8]];
      const M_SMILE = [[3,7],[4,8],[5,9],[6,9],[7,8],[8,7]];
      const Q = [[1,0],[2,0],[0,1],[2,1],[2,2],[1,3],[1,5]];

      const target = new Float32Array(GRID * GRID);
      const cur = new Float32Array(GRID * GRID);
      const at = (c, r) => r * GRID + c;

      function setTarget(cells) {
        target.fill(0);
        for (const [c, r] of cells) target[at(c, r)] = 1;
      }

      function face(look, mouth, shut) {
        const le = shut ? L.shut : L[look];
        const re = shut ? R.shut : R[look];
        setTarget([...le, ...re, ...mouth]);
      }

      function pix(x, y, s, a) {
        ctx.fillStyle = 'rgba(255,255,255,' + a + ')';
        ctx.fillRect(Math.round(x), Math.round(y), s, s);
      }

      function drawQ(x, y, s, a) {
        if (a < 0.15) return;
        for (const [gx, gy] of Q) pix(x + gx * s, y + gy * s, s, a);
      }

      let look = 'l';
      let hovering = false;
      let qAmt = 0, qTarget = 1;
      let lastDraw = 0;
      const FRAME = 70;

      function render(bob) {
        ctx.clearRect(0, 0, SIZE, SIZE);
        for (let r = 0; r < GRID; r++) {
          for (let c = 0; c < GRID; c++) {
            const v = Math.round(cur[at(c, r)] * 3) / 3;
            if (v < 0.05) continue;
            ctx.fillStyle = 'rgba(255,255,255,' + v + ')';
            ctx.fillRect(c * cell + pad, r * cell + pad + bob, PIX, PIX);
          }
        }
        drawQ(58, 2, 2, qAmt);
      }

      face('l', M_SMALL, false);

      if (reduce) {
        cur.set(target);
        qAmt = 1;
        render(0);
        return;
      }

      function tick(t) {
        requestAnimationFrame(tick);
        if (t - lastDraw < FRAME) return;
        lastDraw = t;
        qAmt += (qTarget - qAmt) * 0.35;
        qAmt = Math.round(qAmt * 4) / 4;
        for (let i = 0; i < cur.length; i++) cur[i] += (target[i] - cur[i]) * 0.45;
        render(0);
      }
      requestAnimationFrame(tick);

      const scan = ['l', 'c', 'r', 'c'];
      let step = 0;
      function next() {
        if (hovering) {
          setTimeout(next, 700);
          return;
        }
        const roll = Math.random();
        if (roll < 0.22) {
          face(look, M_SMALL, true);
          setTimeout(() => { if (!hovering) face(look, M_SMALL, false); }, 120);
        } else if (roll < 0.34) {
          look = 'c';
          face('c', M_O, false);
          qTarget = 1;
        } else {
          step = (step + 1) % scan.length;
          look = scan[step];
          face(look, look === 'c' ? M_SMALL : M_O, false);
          qTarget = look === 'c' ? 0.35 : 1;
        }
        setTimeout(next, 900 + Math.random() * 1100);
      }
      setTimeout(next, 700);

      canvas.addEventListener('pointerenter', () => {
        hovering = true;
        look = 'c';
        qTarget = 0;
        face('c', M_SMILE, false);
      });
      canvas.addEventListener('pointerleave', () => {
        hovering = false;
        look = 'l';
        qTarget = 1;
        face('l', M_SMALL, false);
      });
      canvas.addEventListener('pointerdown', () => {
        face('c', M_SMALL, true);
        setTimeout(() => face('c', hovering ? M_SMILE : M_O, false), 140);
      });
    })();
  </script>
</body>
</html>
